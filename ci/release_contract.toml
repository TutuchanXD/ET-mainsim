schema_version = 1
version = "0.1.0"
tag = "v0.1.0"
repository = "TutuchanXD/ET-mainsim"
required_checks = [
  "full-test-gate",
  "package-boundary / py3.12",
  "package-boundary / py3.13",
]
release_policy = [
  "annotated_tag",
  "github_release",
  "no_pypi",
  "no_scientific_simulation",
]

[runtime_dependencies.et_coordinate]
distribution = "et-coord"
repository = "TutuchanXD/ET-coordinate"
commit = "f9cec8038b021c9540a026b94e876dc3240071d1"
version = "0.1.2"

