name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  package-boundary:
    name: package-boundary / py${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out ET-mainsim
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Verify full-test CI contract
        run: python -m ci.verify_full_test_workflow
      - name: Build package without private integration dependency
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install --no-deps dist/*.whl
      - name: Verify lightweight boundary
        run: |
          python -c "import et_mainsim; assert et_mainsim.__version__ == '0.1.0'"
          et-mainsim --help
          python -m compileall -q src
